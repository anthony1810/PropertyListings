<text x="50" y="41" class="k" fill="#3fb950">platform agnostic</text>
<text x="176" y="41" class="d">Foundation only, no UI framework: the same code can back a Mac app, a CLI or an Android app.</text>
<rect x="32" y="52" width="12" height="12" rx="3" fill="#f78166"/>
<text x="50" y="63" class="k" fill="#f78166">platform UI</text>
<text x="176" y="63" class="d">SwiftUI over a view model. The part to replace with AppKit or Android UI, the only layer that depends on iOS.</text>
<rect x="32" y="74" width="12" height="12" rx="3" fill="#e3b341"/>
<text x="50" y="85" class="k" fill="#e3b341">app shell</text>
<text x="176" y="85" class="d">The composition root, one per platform: builds every concrete type once and wires the closures.</text>

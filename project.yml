name: PropertyListings
options:
  bundleIdPrefix: com.anthony
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
packages:
  Listings:
    path: Modules/Listings
  Bookmarks:
    path: Modules/Bookmarks
  HTTPClient:
    path: Modules/Shared/HTTPClient
  TestSupport:
    path: Modules/Shared/TestSupport
  DesignSystem:
    path: Modules/Shared/DesignSystem
  SharedPresentation:
    path: Modules/Shared/SharedPresentation
targets:
  PropertyListings:
    type: application
    platform: iOS
    sources: [PropertyListings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.propertylistings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Architecture guard
        script: '"$SRCROOT/Scripts/architecture-guard.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: PropertyListings/Info.plist
      properties:
        CFBundleDisplayName: PropertyListings
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: Listings
        product: ListingsFeature
      - package: Listings
        product: ListingsAPI
      - package: Listings
        product: ListingsCache
      - package: Listings
        product: ListingsPresentation
      - package: Listings
        product: ListingsUI
      - package: Bookmarks
        product: BookmarksFeature
      - package: Bookmarks
        product: BookmarksPersistence
      - package: Bookmarks
        product: BookmarksPresentation
      - package: Bookmarks
        product: BookmarksUI
      - package: DesignSystem
        product: DesignSystem
      - package: SharedPresentation
        product: SharedPresentation
      - package: HTTPClient
        product: HTTPClient
      - package: HTTPClient
        product: HTTPClientLive
  PropertyListingsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PropertyListingsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PropertyListings
      - package: Listings
        product: ListingsTestSupport
      - package: Bookmarks
        product: BookmarksTestSupport
      - package: TestSupport
        product: TestSupport
  PropertyListingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PropertyListingsUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PropertyListings
  PropertyListingsEndToEndTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [PropertyListingsEndToEndTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: Listings
        product: ListingsAPI
      - package: Listings
        product: ListingsFeature
      - package: HTTPClient
        product: HTTPClientLive
schemes:
  PropertyListings:
    build:
      targets:
        PropertyListings: all
        PropertyListingsTests: [test]
        PropertyListingsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PropertyListingsTests, PropertyListingsUITests]
  PropertyListingsEndToEndTests:
    build:
      targets:
        PropertyListingsEndToEndTests: all
    test:
      config: Debug
      targets: [PropertyListingsEndToEndTests]

name: PropertyListings
options:
  bundleIdPrefix: com.anthony
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
packages:
  Listings:
    path: Modules/Listings
  HTTPClient:
    path: Modules/Shared/HTTPClient
targets:
  PropertyListings:
    type: application
    platform: iOS
    sources: [PropertyListings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.propertylistings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PropertyListings/Info.plist
      properties:
        CFBundleDisplayName: PropertyListings
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  PropertyListingsEndToEndTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [PropertyListingsEndToEndTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: Listings
        product: ListingsAPI
      - package: Listings
        product: ListingsFeature
      - package: HTTPClient
        product: HTTPClientLive
schemes:
  PropertyListings:
    build:
      targets:
        PropertyListings: all
    run:
      config: Debug
  PropertyListingsEndToEndTests:
    build:
      targets:
        PropertyListingsEndToEndTests: all
    test:
      config: Debug
      targets: [PropertyListingsEndToEndTests]

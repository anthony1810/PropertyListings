name: PropertyListings
options:
  bundleIdPrefix: com.anthony
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    LM_SKIP_METADATA_EXTRACTION: YES
packages:
  Listings:
    path: Modules/Listings
  Bookmarks:
    path: Modules/Bookmarks
  Settings:
    path: Modules/Settings
  HTTPClient:
    path: Modules/Shared/HTTPClient
  TestSupport:
    path: Modules/Shared/TestSupport
  DesignSystem:
    path: Modules/Shared/DesignSystem
  SharedPresentation:
    path: Modules/Shared/SharedPresentation
targetTemplates:
  BrandApp:
    type: application
    platform: iOS
    sources:
      - PropertyListings
      - Brands/${brand}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.${bundleName}
        PRODUCT_MODULE_NAME: PropertyListings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Architecture guard
        script: '"$SRCROOT/Scripts/architecture-guard.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Brands/${brand}/Info.plist
      properties:
        CFBundleDisplayName: ${brand}
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: Listings
        product: ListingsFeature
      - package: Listings
        product: ListingsAPI
      - package: Listings
        product: ListingsCache
      - package: Listings
        product: ListingsPresentation
      - package: Listings
        product: ListingsUI
      - package: Bookmarks
        product: BookmarksFeature
      - package: Bookmarks
        product: BookmarksPersistence
      - package: Bookmarks
        product: BookmarksPresentation
      - package: Bookmarks
        product: BookmarksUI
      - package: Settings
        product: SettingsFeature
      - package: Settings
        product: SettingsPersistence
      - package: Settings
        product: SettingsPresentation
      - package: Settings
        product: SettingsUI
      - package: DesignSystem
        product: DesignSystem
      - package: SharedPresentation
        product: SharedPresentation
      - package: HTTPClient
        product: HTTPClient
      - package: HTTPClient
        product: HTTPClientLive
  BrandTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PropertyListingsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ${brand}
      - package: Listings
        product: ListingsTestSupport
      - package: Bookmarks
        product: BookmarksTestSupport
      - package: Settings
        product: SettingsTestSupport
      - package: TestSupport
        product: TestSupport
targets:
  PropertyListings:
    templates: [BrandApp]
    templateAttributes:
      brand: PropertyListings
      bundleName: propertylistings
  Lakeside:
    templates: [BrandApp]
    templateAttributes:
      brand: Lakeside
      bundleName: lakeside
    info:
      properties:
        UIAppFonts: [Manrope-Variable.ttf]
  PropertyListingsTests:
    templates: [BrandTests]
    templateAttributes:
      brand: PropertyListings
  LakesideTests:
    templates: [BrandTests]
    templateAttributes:
      brand: Lakeside
  PropertyListingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PropertyListingsUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PropertyListings
  PropertyListingsEndToEndTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [PropertyListingsEndToEndTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: Listings
        product: ListingsAPI
      - package: Listings
        product: ListingsFeature
      - package: HTTPClient
        product: HTTPClientLive
schemes:
  PropertyListings:
    build:
      targets:
        PropertyListings: all
        PropertyListingsTests: [test]
        PropertyListingsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PropertyListingsTests, PropertyListingsUITests]
  Lakeside:
    build:
      targets:
        Lakeside: all
        LakesideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LakesideTests]
  PropertyListingsEndToEndTests:
    build:
      targets:
        PropertyListingsEndToEndTests: all
    test:
      config: Debug
      targets: [PropertyListingsEndToEndTests]

name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=latest

jobs:
  host-packages:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - Modules/Shared/TestSupport
          - Modules/Shared/HTTPClient
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path ${{ matrix.package }}

  simulator-packages:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [SharedPresentation, DesignSystem]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -o pipefail
          xcodebuild test \
            -scheme ${{ matrix.package }}-Package \
            -destination "$SIMULATOR" \
            -skipPackagePluginValidation \
          | xcbeautify
        working-directory: Modules/Shared/${{ matrix.package }}

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: Scripts/architecture-guard.sh
      - run: |
          set -o pipefail
          xcodebuild build \
            -workspace PropertyListings.xcworkspace \
            -scheme PropertyListings \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
